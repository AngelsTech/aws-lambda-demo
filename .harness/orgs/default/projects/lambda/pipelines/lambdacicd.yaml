pipeline:
  name: aws_lambda_demo_v2
  identifier: lambdacicd
  projectIdentifier: lambda
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: aws-lambda-demo
        build: <+input>
  stages:
    - stage:
        name: Build_and_Package
        identifier: Build_and_Package
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: eksconnector
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              os: Linux
              nodeSelector: {}
          execution:
            steps:
              - step:
                  name: Install_Dependencies
                  identifier: Install_Dependencies
                  type: Run
                  spec:
                    connectorRef: eksconnector
                    image: python:3.13-alpine
                    shell: Sh
                    command: |
                      echo "Installing Python dependencies..."
                      mkdir -p python
                      pip install -r test/devtest/requirements.txt -t python
                      zip -r layer_package.zip python
                      echo "Layer package created successfully"
                      ls -lh layer_package.zip
                    outputVariables:
                      - name: LAYER_PACKAGE
                        type: String
                        value: layer_package.zip
              - step:
                  name: Package_Lambda
                  identifier: Package_Lambda
                  type: Run
                  spec:
                    connectorRef: eksconnector
                    image: python:3.13-alpine
                    shell: Sh
                    command: |
                      echo "Zipping Lambda function code..."
                      cd test
                      zip -r ../lambda_package.zip devtest \
                        -x "**/.git/*" \
                        -x "**/README.md" \
                        -x "**/Jenkinsfile" \
                        -x "**/__pycache__/*" \
                        -x "**/*.pyc"
                      cd ..
                      echo "Lambda package contents:"
                      unzip -l lambda_package.zip
                      echo "Package size:"
                      ls -lh lambda_package.zip
                    outputVariables:
                      - name: LAMBDA_PACKAGE
                        type: String
                        value: lambda_package.zip
              - step:
                  name: Publish_Lambda_Layer
                  identifier: Publish_Lambda_Layer
                  type: Run
                  spec:
                    connectorRef: awsconnector
                    image: python:3.13-alpine
                    shell: Sh
                    command: |
                      apk add --no-cache curl jq bash
                      LAYER_NAME="hey-world-deps-<+env.name>"
                      echo "Publishing Lambda Layer: $LAYER_NAME"

                      LAYER_VERSION=$(aws lambda publish-layer-version \
                        --layer-name $LAYER_NAME \
                        --zip-file fileb://<+pipeline.stages.Build_and_Package.spec.execution.steps.Install_Dependencies.output.outputVariables.LAYER_PACKAGE> \
                        --compatible-runtimes python3.13 \
                        --description "Dependencies for hey-world Lambda - <+env.name>" \
                        --query Version --output text)

                      echo "Layer version published: $LAYER_VERSION"
                      echo "LAYER_VERSION=$LAYER_VERSION" >> layer.env
                    outputVariables:
                      - name: LAYER_VERSION
                        type: String
                        value: LAYER_VERSION
              - step:
                  name: Deploy_Lambda_Function
                  identifier: Deploy_Lambda_Function
                  type: Run
                  spec:
                    connectorRef: awsconnector
                    image: python:3.13-alpine
                    shell: Sh
                    command: |
                      apk add --no-cache curl jq bash
                      FUNCTION_NAME="hey-world-demo-<+env.name>"
                      ZIP_FILE="<+pipeline.stages.Build_and_Package.spec.execution.steps.Package_Lambda.output.outputVariables.LAMBDA_PACKAGE>"
                      LAYER_VERSION="<+pipeline.stages.Build_and_Package.spec.execution.steps.Publish_Lambda_Layer.output.outputVariables.LAYER_VERSION>"
                      ROLE_ARN="arn:aws:iam::529088259986:role/lambda_exec_role_<+env.name>"

                      if ! aws lambda get-function --function-name $FUNCTION_NAME > /dev/null 2>&1; then
                        aws lambda create-function \
                          --function-name $FUNCTION_NAME \
                          --runtime python3.13 \
                          --role $ROLE_ARN \
                          --handler devtest.lambda_function.lambda_handler \
                          --zip-file fileb://$ZIP_FILE \
                          --layers arn:aws:lambda:us-east-1:529088259986:layer:hey-world-deps-<+env.name>:$LAYER_VERSION \
                          --timeout 30 \
                          --memory-size 256
                        aws lambda wait function-active --function-name $FUNCTION_NAME
                      else
                        aws lambda update-function-code \
                          --function-name $FUNCTION_NAME \
                          --zip-file fileb://$ZIP_FILE
                        aws lambda wait function-updated --function-name $FUNCTION_NAME
                        aws lambda update-function-configuration \
                          --function-name $FUNCTION_NAME \
                          --layers arn:aws:lambda:us-east-1:529088259986:layer:hey-world-deps-<+env.name>:$LAYER_VERSION \
                          --timeout 30 \
                          --memory-size 256
                      fi
              - step:
                  name: Setup_CloudWatch_Schedule
                  identifier: Setup_CloudWatch_Schedule
                  type: Run
                  spec:
                    connectorRef: awsconnector
                    image: python:3.13-alpine
                    shell: Sh
                    command: |
                      apk add --no-cache curl jq bash
                      FUNCTION_NAME="hey-world-demo-<+env.name>"
                      RULE_NAME="hello-world-schedule-<+env.name>"
                      SCHEDULE="rate(5 minutes)"
                      STATEMENT_ID="cw-invoke-<+env.name>"

                      aws events put-rule \
                        --name $RULE_NAME \
                        --schedule-expression "$SCHEDULE" \
                        --state ENABLED \
                        --description "Trigger hey-world Lambda every 5 minutes - <+env.name>"

                      FUNCTION_ARN=$(aws lambda get-function \
                        --function-name $FUNCTION_NAME \
                        --query 'Configuration.FunctionArn' \
                        --output text)

                      aws events put-targets \
                        --rule $RULE_NAME \
                        --targets "Id"="1","Arn"="$FUNCTION_ARN"

                      SOURCE_ARN=$(aws events describe-rule \
                        --name $RULE_NAME \
                        --query 'Arn' \
                        --output text)

                      if ! aws lambda get-policy --function-name $FUNCTION_NAME 2>/dev/null | grep -q $STATEMENT_ID; then
                        aws lambda add-permission \
                          --function-name $FUNCTION_NAME \
                          --statement-id $STATEMENT_ID \
                          --action 'lambda:InvokeFunction' \
                          --principal events.amazonaws.com \
                          --source-arn $SOURCE_ARN
                      fi
              - step:
                  name: Test_Lambda_Function
                  identifier: Test_Lambda_Function
                  type: Run
                  spec:
                    connectorRef: awsconnector
                    image: python:3.13-alpine
                    shell: Sh
                    command: |
                      apk add --no-cache curl jq bash
                      FUNCTION_NAME="hey-world-demo-<+env.name>"

                      RESPONSE=$(aws lambda invoke \
                        --function-name $FUNCTION_NAME \
                        --payload '{}' \
                        --cli-binary-format raw-in-base64-out \
                        lambda-response.json)

                      echo "$RESPONSE"
                      cat lambda-response.json

                      if echo "$RESPONSE" | grep -q '"StatusCode": 200'; then
                        echo "Lambda test successful!"
                      else
                        echo "Lambda test failed!"
                        exit 1
    - stage:
        name: Deploy_Manifests
        identifier: Deploy_Manifests
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  manifests:
                    - manifest:
                        identifier: lambda-deployment
                        type: K8sManifest
                        spec:
                          store:
                            type: Github
                            spec:
                              connectorRef: <+input>
                              branch: harness
                              paths:
                                - manifests/lambda.yaml
          environment:
            environmentRef: <+input>
          execution:
            steps:
              - step:
                  name: No_Op
                  identifier: No_Op
                  type: Run
                  spec:
                    shell: Sh
                    connectorRef: eksconnector
                    image: python:3.13-alpine
                    command: |
                      echo "No steps to execute in Deployment stage"
