pipeline:
  name: LambdaPipeline
  identifier: lambdacicd
  projectIdentifier: lambda
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: githup-harness
        repoName: aws-lambda-demo
        build:
          type: branch
          spec:
            branch: harness
  stages:
    - stage:
        name: Build_and_Package
        identifier: Build_and_Package
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: eksconnector
              namespace: default
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Build_and_Zip
                  identifier: Build_and_Zip
                  spec:
                    connectorRef: eksconnector
                    image: python:3.9
                    shell: Sh
                    command: |
                      pip install -r requirements.txt
                      zip -r function.zip .
              - step:
                  type: Run
                  name: Upload_to_S3
                  identifier: Upload_to_S3
                  spec:
                    connectorRef: eksconnector
                    image: amazon/aws-cli:2.15.0
                    shell: Sh
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("ACCESS_KEY_ID")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("SECRET_ACCESS_KEY")>
                    command: |
                      aws s3 cp function.zip s3://mybucket/function.zip
    - stage:
        name: Deploy_Lambda
        identifier: Deploy_Lambda
        type: CI
        spec:
          cloneCodebase: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: eksconnector
              namespace: default
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Download_from_S3
                  identifier: Download_from_S3
                  spec:
                    connectorRef: eksconnector
                    image: amazon/aws-cli:2.15.0
                    shell: Sh
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("ACCESS_KEY_ID")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("SECRET_ACCESS_KEY")>
                    command: |
                      aws s3 cp s3://mybucket/function.zip function.zip
              - step:
                  type: Run
                  name: Update_Lambda
                  identifier: Update_Lambda
                  spec:
                    connectorRef: eksconnector
                    image: amazon/aws-cli:2.15.0
                    shell: Sh
                    envVariables:
                      AWS_ACCESS_KEY_ID: <+secrets.getValue("ACCESS_KEY_ID")>
                      AWS_SECRET_ACCESS_KEY: <+secrets.getValue("SECRET_ACCESS_KEY")>
                    command: |
                      aws lambda update-function-code --function-name MyLambdaFunction --zip-file fileb://function.zip
